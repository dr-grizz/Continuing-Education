name: continuing-education-prototype
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: continuing_education
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portal_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d continuing_education"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  portal_data:
