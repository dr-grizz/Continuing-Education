<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Claim your badge or certificate | Continuing Education</title><link rel="stylesheet" href="/credential-tools/awards.css"><link rel="stylesheet" href="/credential-tools/distribution.css"><script defer src="/credential-tools/claim.js"></script></head><body><main class="cu-awards"><section class="ca-card"><h1>Claim your badge or certificate</h1><p>Sign in with the learner account that earned this accomplishment, then enter your claim code. Each code is for one named learner; receiving a code does not transfer the award to a different account.</p><p id="claim-session" role="status"></p><a id="claim-sign-in" href="/sign-in?returnTo=%2Fcredential-tools%2Fclaim.html">Sign in to claim</a><form id="claim-form"><label for="claim-code">Claim code</label><input id="claim-code" maxlength="100" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" required><button id="claim-submit" type="submit">Claim accomplishment</button></form><p id="claim-status" role="status" aria-live="polite"></p><section id="claim-receipt" hidden tabindex="-1" aria-labelledby="claim-title"></section><p><a href="/badges">Open My Badges and certificates</a></p></section></main></body></html>
