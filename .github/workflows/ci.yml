name: CI
# Checks every pull request against a throwaway PostgreSQL service with
# synthetic data. Nothing here deploys or connects to external systems.
# Skipped when every changed file is documentation; any code, test or config
# change runs the full job. Run it by hand with "Run workflow" if needed.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, prototype-checkpoint, Badges-and-Certificates]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: portal
          POSTGRES_DB: continuing_education
          # Throwaway service that exists only for this job; not a secret.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portal -d continuing_education"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Write the local environment
        run: |
          token() { openssl rand -hex 24; }
          cat > .env <<ENV
          PROTOTYPE_MODE=true
          DATABASE_URL=postgresql://portal:ci-only-password@127.0.0.1:5433/continuing_education
          POSTGRES_PASSWORD=ci-only-password
          API_URL=http://127.0.0.1:3051
          WEB_URL=http://127.0.0.1:3050
          BADGES_ENABLED=true
          BADGE_SERVICE_URL=http://127.0.0.1:4178
          BADGE_DATA_DIR=badge-service/data
          CERTIFICATE_PYTHON=python3
          LEARNER_API_TOKEN=$(token)
          STAFF_API_TOKEN=$(token)
          AUTOMATION_API_TOKEN=$(token)
          STRIPE_WEBHOOK_SECRET=whsec_ci_$(token)
          ENV
          cp .env src/web/.env.local
      - run: npm ci
      - run: npm ci --prefix badge-service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r badge-service/certificate-renderer/requirements.txt pypdf==6.10.0
      - name: Badge service and portal broker tests
        run: npm run test:badges
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate the database
        run: npm run db:migrate
      - name: Migration tests
        run: npm run test:migrations
      - name: Offering visibility tests (disposable database)
        run: npm run test:visibility
      - name: Canvas authentication tests (mock provider, disposable database)
        run: npm run test:auth
      - name: Learner Canvas authentication tests (mock provider, disposable database)
        run: npm run test:learner-auth
      - name: Canvas course connector tests (mock provider, disposable database)
        run: npm run test:canvas
      - name: Request-driven demo tests (disposable database, no worker)
        run: npm run test:demo
      - name: Build
        run: npm run build
      - name: Start the API and website (no worker)
        run: |
          mkdir -p logs
          nohup npm run dev:badges > logs/badges.log 2>&1 &
          nohup npm run dev:api > logs/api.log 2>&1 &
          nohup npm run start:web > logs/web.log 2>&1 &
          for url in http://127.0.0.1:3051/api/docs http://127.0.0.1:3050/; do
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && break
              [ "$i" = 60 ] && { echo "Timed out waiting for $url"; exit 1; }
              sleep 2
            done
          done
      - name: Integration tests
        run: npm test
      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Accessibility checks (axe in Chrome, Firefox and WebKit; forced colors; reflow and text resizing)
        run: npm run test:a11y
      - name: Server logs
        if: failure()
        run: tail -n 100 logs/*.log || true
      - name: Upload the accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
