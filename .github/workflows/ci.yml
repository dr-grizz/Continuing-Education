name: CI
# Checks every pull request against a throwaway PostgreSQL service with
# synthetic data. Only a successful push on azure-demo can run the separate,
# OIDC-authenticated deployment job; checks never receive cloud credentials.
# Skipped when every changed file is documentation; any code, test or config
# change runs backend checks and the quick browser suite. The full browser
# matrix is available through "Run workflow".
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    # main runs checks only. The deploy job below permits azure-demo exclusively.
    branches: [main, azure-demo, prototype-checkpoint, Badges-and-Certificates]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run all browser engines and layouts (slower)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A new demo push must never cancel a ZIP upload already in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/azure-demo' }}
jobs:
  check:
    # azure-demo pushes run the same check and CD; avoid duplicating that work
    # in its open PR. Fork PRs still run the unprivileged checks.
    if: github.event_name != 'pull_request' || github.head_ref != 'azure-demo' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_QUICK: ${{ inputs.full_browser_suite != true && 'true' || 'false' }}
    services:
      db:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: portal
          POSTGRES_DB: continuing_education
          # Throwaway service that exists only for this job; not a secret.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portal -d continuing_education"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Write the local environment
        run: |
          token() { openssl rand -hex 24; }
          cat > .env <<ENV
          PROTOTYPE_MODE=true
          DATABASE_URL=postgresql://portal:ci-only-password@127.0.0.1:5433/continuing_education
          POSTGRES_PASSWORD=ci-only-password
          API_URL=http://127.0.0.1:3051
          WEB_URL=http://127.0.0.1:3050
          BADGES_ENABLED=true
          BADGE_SERVICE_URL=http://127.0.0.1:4178
          BADGE_DATA_DIR=badge-service/data
          CERTIFICATE_PYTHON=python3
          LEARNER_API_TOKEN=$(token)
          STAFF_API_TOKEN=$(token)
          AUTOMATION_API_TOKEN=$(token)
          STRIPE_WEBHOOK_SECRET=whsec_ci_$(token)
          ENV
          cp .env src/web/.env.local
      - run: npm ci
      - run: npm ci --prefix badge-service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r badge-service/certificate-renderer/requirements.txt pypdf==6.10.0
      - name: Badge service and portal broker tests
        run: npm run test:badges
      - name: Format check
        run: npm run format:check
      - name: Hosted demo boundary tests
        run: npm run test:hosting
      - name: Request limits and encryption security tests
        run: npm run test:security
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate the database
        run: npm run db:migrate
      - name: Migration tests
        run: npm run test:migrations
      - name: Offering visibility tests (disposable database)
        run: npm run test:visibility
      - name: Canvas authentication tests (mock provider, disposable database)
        run: npm run test:auth
      - name: Learner Canvas authentication tests (mock provider, disposable database)
        run: npm run test:learner-auth
      - name: Canvas staff directory lookup (mock provider, disposable database)
        run: npm run test:staff-lookup
      - name: Canvas course connector tests (mock provider, disposable database)
        run: npm run test:canvas
      - name: Request-driven demo tests (disposable database, no worker)
        run: npm run test:demo
      - name: Build
        run: npm run build
      - name: Prepare and verify the minimal deployment package
        if: github.event_name == 'push' && github.ref == 'refs/heads/azure-demo'
        env:
          BADGES_ENABLED: "false"
          DEMO_ACCESS_GATE: basic
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npm run package:demo
          npm run verify:demo
          node scripts/demo-schema-hash.mjs > artifacts/schema.sha256
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          writeFileSync('artifacts/azure-demo/release.json', JSON.stringify({
            revision: process.env.RELEASE_SHA,
            schema: readFileSync('artifacts/schema.sha256', 'utf8').trim(),
          }));
          JS
          (cd artifacts/azure-demo && zip -q -r ../azure-demo.zip .)
      - name: Start the API and website (no worker)
        run: |
          mkdir -p logs
          nohup npm run dev:badges > logs/badges.log 2>&1 &
          nohup npm run dev:api > logs/api.log 2>&1 &
          nohup npm run start:web > logs/web.log 2>&1 &
          for url in http://127.0.0.1:3051/api/docs http://127.0.0.1:3050/; do
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && break
              [ "$i" = 60 ] && { echo "Timed out waiting for $url"; exit 1; }
              sleep 2
            done
          done
      - name: Integration tests
        run: npm test
      - name: Install Chromium for quick checks
        if: env.CI_QUICK == 'true'
        run: npx playwright install --with-deps chromium
      - name: Install all Playwright browsers
        if: env.CI_QUICK != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Accessibility checks (quick by default; full matrix on request)
        run: npm run test:a11y
      - name: Server logs
        if: failure()
        run: tail -n 100 logs/*.log || true
      - name: Upload the accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Retain the verified release for deployment and rollback
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/azure-demo'
        uses: actions/upload-artifact@v4
        with:
          name: azure-demo-${{ github.sha }}
          path: |
            artifacts/azure-demo.zip
            artifacts/schema.sha256
          retention-days: 14

  deploy:
    name: Deploy Azure demo
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/azure-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Finish an upload already in progress; never interrupt it with another.
    concurrency:
      group: deploy-cuce-demo
      cancel-in-progress: false
    env:
      AZURE_WEBAPP_NAME: cuce-demo
      AZURE_RESOURCE_GROUP: rg-continuinged-demo
      RELEASE_SHA: ${{ github.sha }}
      APPROVED_SCHEMA: ${{ vars.AZURE_DEMO_SCHEMA_HASH }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-demo-${{ github.sha }}
          path: release
      - name: Require the operator-approved database migration set
        run: |
          test -n "$APPROVED_SCHEMA" || { echo "AZURE_DEMO_SCHEMA_HASH is not configured."; exit 1; }
          test "$(cat release/schema.sha256)" = "$APPROVED_SCHEMA" || {
            echo "Database migrations changed. Back up and migrate explicitly, then update AZURE_DEMO_SCHEMA_HASH."
            exit 1
          }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEMO_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEMO_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_DEMO_SUBSCRIPTION_ID }}
      - name: Check the F1 target and select Node 24
        run: |
          plan=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query serverFarmId -o tsv)
          test "$(az appservice plan show --ids "$plan" --query sku.name -o tsv)" = F1
          test "$(az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT'].value | [0]" -o tsv)" = false
          az webapp config set -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --linux-fx-version 'NODE|24-lts' --startup-file 'node scripts/start-demo.mjs' --output none
      - name: Deploy the verified ZIP using Microsoft Entra authentication
        run: |
          az webapp deploy -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" \
            --src-path release/azure-demo.zip --type zip --clean true \
            --restart true --track-status true --timeout 600000 --output none
      - name: Verify the published revision through authenticated SCM
        run: |
          revision=$(az rest --method get \
            --url "https://$AZURE_WEBAPP_NAME.scm.azurewebsites.net/api/vfs/site/wwwroot/release.json" \
            --resource https://management.azure.com/ --query revision -o tsv)
          test "$revision" = "$RELEASE_SHA"
          test "$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query state -o tsv)" = Running
          echo "Published $RELEASE_SHA to https://$AZURE_WEBAPP_NAME.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"
          echo "Campus IP restrictions remain active. Browser/OAuth/payment smoke tests require an allowed network." >> "$GITHUB_STEP_SUMMARY"
